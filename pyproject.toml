[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local-companion"
version = "0.5.0"
description = "Local-first Jarvis conversation, hearing, speech, and safe robot simulation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Jarvis contributors" }]
dependencies = [
    "httpx>=0.27,<1",
    "ollama>=0.6.2,<0.7",
    "sounddevice>=0.5.6,<0.6",
    "kokoro-onnx==0.6.1",
    "piper-tts==1.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
